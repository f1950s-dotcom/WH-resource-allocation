name: Deploy user guide to GitHub Pages

on:
  push:
    branches: [claude/busy-cori-b3y1om]
    paths:
      - docs/user_guide.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp docs/user_guide.html _site/user_guide.html
          # バレURL(/)からガイドへリダイレクト
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="ja"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./user_guide.html">
          <title>倉庫人員配置最適化システム ユーザーガイド</title></head>
          <body><p><a href="./user_guide.html">ユーザーガイドへ移動</a></p></body></html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
